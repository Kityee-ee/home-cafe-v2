<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f5f0">
  <meta name="robots" content="noindex">
  <title>Barista Board · Home Café</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Figtree:wght@400;500;600&display=swap">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%98%95%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="page host-page">
    <header class="top">
      <p class="wordmark">Home Café</p>
    </header>

    <section>
      <p class="eyebrow">Behind the counter</p>
      <h1>Barista Board</h1>
      <p class="muted" id="host-status" role="status">Loading orders…</p>
      <button type="button" class="link-btn" id="refresh">Refresh</button>
    </section>

    <section class="card" aria-labelledby="prep-title">
      <h2 id="prep-title">Prep list</h2>
      <div id="prep"><p class="muted">Orders will show here as guests place them.</p></div>
    </section>

    <div id="orders" class="page" style="padding:0;gap:16px"></div>
  </main>
  <script src="/host.js" type="module"></script>
</body>
</html>
